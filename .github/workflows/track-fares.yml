name: Track Chicago-London fares

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-fares:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fare tracker
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
        run: python tracker.py

      - name: Save updated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SUMMARY.md data/
          git diff --cached --quiet || git commit -m "Update fare tracking data"
          git push